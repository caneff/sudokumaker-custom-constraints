[GLOBAL]
pants_version = "2.33.1"
backend_packages = [
  "pants.backend.python",
  "pants.backend.shell",
  "pants.backend.experimental.adhoc",
  "pants.backend.experimental.javascript",
]
process_execution_local_parallelism = 4
pants_ignore = ["/.claude/", "/.scratch/", "node_modules/"]

[source]
root_patterns = [
  "/finders/ubahn",
  "/finders/hunt",
  "/examples/_shared",
  "/examples/up-to-n",
]

[python]
interpreter_constraints = [">=3.11,<3.14"]
enable_resolves = true

[python.resolves]
python-default = "3rdparty/python/default.lock"

[python-infer]
ambiguity_resolution = "by_source_root"
unowned_dependency_behavior = "ignore"

[nodejs-infer]
unowned_dependency_behavior = "ignore"

# /usr/bin/python3.12 here has no ensurepip (python3-venv not installed), which Pex needs.
# Point Pants at a uv-managed interpreter instead. Machine-specific path: spike only.
[python-bootstrap]
search_path = ["/home/caneff/.local/share/uv/python/cpython-3.13-linux-x86_64-gnu/bin"]
