# Fast local gate before each commit. Run once after cloning:
#   uvx pre-commit install
# The full gate (tests + soundness fuzz) is too slow for a commit hook and runs
# in CI via `just check-full`. Keep verbatim comparison files and probe goldens
# untouched — they must stay byte-for-byte.
exclude: '^(examples/numbered-rooms/original/|examples/skyscraper/original/|examples/[^/]+/\.golden/)'

# Only the layout gate also runs on push; every other hook is commit-only.
default_stages: [pre-commit]
default_install_hook_types: [pre-commit, pre-push]

repos:
  # Python: ruff check + format, its own isolated env, reads ruff.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Upstream hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  # JavaScript: StandardJS runs from the repo's node_modules, reading the
  # package.json "standard" config (globals, snippet excludes). pass_filenames
  # is off so it lints the whole project as configured, not a hook-passed list.
  - repo: local
    hooks:
      - id: standard
        name: StandardJS
        entry: npx standard
        language: system
        files: '\.(js|mjs)$'
        pass_filenames: false

  # The layout gate (#879): check_layout and the research-load scan (#659) run
  # on a docs-only change, and each reads the whole tree, so the hooks take no
  # filenames. About 3 s. See docs/testing-and-generation.md.
  - repo: local
    hooks:
      - id: check-layout
        name: check_layout
        entry: uv run examples/_shared/check_layout.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
      - id: check-research-loads
        name: check_research_loads
        entry: uv run examples/_shared/check_research_loads.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
