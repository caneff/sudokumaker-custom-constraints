# Fast local gate before each commit. Run once after cloning:
#   uvx pre-commit install --hook-type pre-commit --hook-type pre-push
# The full gate (tests + soundness fuzz) is too slow for a commit hook and runs
# in CI via `just check-full`. Keep verbatim comparison files and probe goldens
# untouched — they must stay byte-for-byte.
exclude: '^(examples/numbered-rooms/original/|examples/skyscraper/original/|examples/[^/]+/\.golden/)'

repos:
  # Python: ruff check + format, its own isolated env, reads ruff.toml.
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  # Upstream hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json

  # JavaScript: StandardJS runs from the repo's node_modules, reading the
  # package.json "standard" config (globals, snippet excludes). pass_filenames
  # is off so it lints the whole project as configured, not a hook-passed list.
  - repo: local
    hooks:
      - id: standard
        name: StandardJS
        entry: npx standard
        language: system
        files: '\.(js|mjs)$'
        pass_filenames: false

  # The layout gate (#879). Its research-load rule (#659) ran only inside
  # `just check`, so a docs commit auto-shipped to main never met it and main
  # went red. always_run: a docs-only change must trigger it, and it reads the
  # whole tree, so it takes no filenames. About 3 s. Install both stages:
  #   uvx pre-commit install --hook-type pre-commit --hook-type pre-push
  - repo: local
    hooks:
      - id: check-layout
        name: check_layout
        entry: uv run examples/_shared/check_layout.py
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit, pre-push]
