name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  # A push or pull request runs one leg, `narrowed`: `bash tests/all.sh
  # --changed <base>` (AGENTS.md § End-to-end seam). The full gate -- `check`
  # and the three heavy recipes, `check-full`'s coverage as four side-by-side
  # legs -- runs nightly on the schedule and by hand (workflow_dispatch), and
  # never per change (Chris, 2026-10-16, #846). The matrix is one expression
  # so the setup steps below stay in one place.
  # `examples/_shared/ci_workflow.test.py` fails if the scheduled list stops
  # covering exactly what `just check-full` runs -- the justfile recipes are
  # the source of truth, not this list of names.
  gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        recipe: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'pull_request') && '["narrowed"]' || '["check","test-heavy-fillomino","test-heavy-recovery","soundness"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dev tools (StandardJS)
        run: npm ci

      # app-session.test.mjs drives Chromium against the recorded app; only a
      # leg that can run it installs Chromium.
      - name: Install Chromium (Playwright)
        if: matrix.recipe == 'check' || matrix.recipe == 'narrowed'
        run: npx playwright install --with-deps chromium

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: uv sync
        run: uv sync

      # Suites run through Pants (just_list.test.py, gate.test.py) call a
      # `just` binary on PATH; `uvx` alone leaves none installed.
      - name: Install just
        run: uv tool install rust-just

      # The Pants launcher, cached with the Pants it downloads. Only the
      # install is cached: pants.toml turns the result cache off, so every
      # suite still runs on every leg.
      - name: Install Pants
        uses: pantsbuild/actions/init-pants@v11
        with:
          gha-cache-key: v0
          named-caches-hash: ${{ hashFiles('pants.toml') }}

      # Every leg's runner-side run log (#845) goes to one path the job uploads,
      # so CI runs, scheduled ones included, are counted. `runner` is not in
      # scope for a job-level `env`, so the path is set through GITHUB_ENV.
      - name: Point the seam run log at an uploaded path
        run: echo "SEAM_RUNS_LOG=$RUNNER_TEMP/seam-runs.jsonl" >> "$GITHUB_ENV"

      # The base is the PR base on a pull request and the push's `before` on a
      # push. An all-zeros `before` (a new branch) or one the clone lacks (a
      # force-push) has no base: widen to the full seam and say so.
      - name: Narrowed seam
        if: matrix.recipe == 'narrowed'
        env:
          BASE_REF: ${{ github.base_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "${{ github.event_name }}" = pull_request ]; then
            base="origin/$BASE_REF"
          else
            base="$BEFORE"
          fi
          if [ "$base" = 0000000000000000000000000000000000000000 ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::notice::no usable base ($base): widening to the full seam"
            bash tests/all.sh
          else
            bash tests/all.sh --changed "$base"
          fi

      - name: Gate (${{ matrix.recipe }})
        if: matrix.recipe != 'narrowed'
        run: uvx --from rust-just just ${{ matrix.recipe }}

      - name: Upload seam run log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seam-runs-${{ matrix.recipe }}
          path: ${{ runner.temp }}/seam-runs.jsonl
