name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dev tools (StandardJS)
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # A pull request runs the full gate (`check-full`: lint, every test,
      # soundness fuzz); a push to main runs the fast `check` (#411). See the
      # justfile.
      - name: Gate
        run: uvx --from rust-just just ${{ github.event_name == 'pull_request' && 'check-full' || 'check' }}
