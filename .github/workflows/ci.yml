name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A pull request runs `check-full`'s coverage as four side-by-side legs
  # instead of one long step; a push to main runs only `check` (#411, split
  # into parallel jobs in #424). `examples/_shared/ci_workflow.test.py` fails
  # if this matrix stops covering exactly what `just check-full` runs -- the
  # justfile recipes below are the source of truth, not this list of names.
  gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || matrix.recipe == 'check'
    strategy:
      fail-fast: false
      matrix:
        recipe: [check, test-heavy-fillomino, test-heavy-recovery, soundness]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install JS dev tools (StandardJS)
        run: npm ci

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Gate (${{ matrix.recipe }})
        run: uvx --from rust-just just ${{ matrix.recipe }}
